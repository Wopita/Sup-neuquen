<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tablapandilla | AI Wind Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --header-height: 60px;
        }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
        
        body {
            height: 100vh;
            height: -webkit-fill-available;
            overflow: hidden;
        }

        #main-layout {
            height: calc(100vh - var(--header-height));
            height: calc(100dvh - var(--header-height));
        }

        .ai-gradient {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Sidebar Mobile: Overlay Estilo App Moderno */
        #sidebar-ai {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
        }

        @media (max-width: 768px) {
            .mobile-hidden { 
                transform: translateX(-100%); 
                opacity: 0;
                pointer-events: none;
            }
            .mobile-visible { 
                transform: translateX(0); 
                opacity: 1;
                pointer-events: auto;
            }
        }

        /* Ajuste del Iframe para forzar visibilidad de tabla */
        iframe {
            min-height: 100%;
            width: 100%;
        }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-200 flex flex-col">

    <!-- Header Principal -->
    <header class="bg-[#1e293b] border-b border-slate-700 h-[60px] flex justify-between items-center px-4 shadow-xl z-[110]">
        <div class="flex items-center gap-2">
            <button onclick="toggleMobileMenu()" class="md:hidden text-blue-400 p-2 hover:bg-slate-800 rounded-lg transition-colors">
                <i class="fa-solid fa-bars-staggered text-xl"></i>
            </button>
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 p-1.5 rounded-lg">
                    <i class="fa-solid fa-wind text-white text-sm"></i>
                </div>
                <h1 class="text-sm md:text-lg font-bold text-white uppercase italic tracking-tighter">Tablapandilla <span class="text-blue-400 font-normal">v3.5</span></h1>
            </div>
        </div>
        
        <div class="flex items-center gap-2">
            <button onclick="generateAIReport()" class="ai-gradient text-white px-3 py-1.5 rounded-full text-[10px] md:text-xs font-bold flex items-center gap-2 shadow-lg shadow-blue-500/20 active:scale-95 transition-transform">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span class="hidden sm:inline">ANÁLISIS IA</span>
            </button>
            <button onclick="toggleMobileMenu()" class="md:hidden bg-blue-500/10 text-blue-400 p-2 rounded-full border border-blue-500/20">
                <i class="fa-solid fa-comment-dots"></i>
            </button>
        </div>
    </header>

    <div id="main-layout" class="flex flex-1 relative overflow-hidden">
        
        <!-- Sidebar: Chat & Ubicaciones (Overlay en Mobile) -->
        <aside id="sidebar-ai" class="absolute md:relative w-full md:w-[320px] bg-[#0b0f1a]/95 md:bg-[#0b0f1a] border-r border-slate-800 h-full flex flex-col mobile-hidden md:translate-x-0">
            
            <!-- Listado de Ubicaciones -->
            <div class="p-4 border-b border-slate-800/50">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Spots Tablapandilla</h2>
                    <button onclick="toggleMobileMenu()" class="md:hidden text-slate-500 hover:text-white transition-colors">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>
                <div id="spots-list" class="grid grid-cols-2 md:grid-cols-1 gap-2"></div>
            </div>
            
            <!-- Chat Inteligente -->
            <div class="p-4 flex flex-col flex-1 overflow-hidden">
                <div class="flex items-center gap-2 mb-3">
                    <span class="flex h-2 w-2 rounded-full bg-green-500 animate-pulse"></span>
                    <h2 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Gemini AI Assistant</h2>
                </div>
                
                <div id="chat-container" class="bg-slate-900/40 rounded-2xl border border-slate-800/50 p-3 flex-1 overflow-y-auto text-[11px] space-y-3 flex flex-col">
                    <div class="bg-blue-600/10 border border-blue-600/20 p-2.5 rounded-2xl text-blue-200">
                        ¡Hola Wopita! 👋 Ya tengo los datos de Windy cargados. ¿Remamos hoy?
                    </div>
                </div>

                <!-- Input de Chat -->
                <div class="mt-3 relative">
                    <input type="text" id="chat-input" placeholder="Preguntá al experto..." class="w-full bg-slate-800/50 border border-slate-700 rounded-2xl px-4 py-3 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/50 text-white placeholder-slate-500">
                    <button onclick="askAI()" class="absolute right-2 top-1/2 -translate-y-1/2 bg-blue-600 p-2 rounded-xl hover:bg-blue-500 shadow-lg shadow-blue-600/20 transition-all active:scale-90">
                        <i class="fa-solid fa-paper-plane text-[10px]"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Área Principal del Mapa -->
        <main class="flex-1 relative bg-[#0f172a] h-full overflow-hidden">
            
            <!-- Loader Estilizado -->
            <div id="map-loader" class="absolute inset-0 flex flex-col items-center justify-center bg-[#0f172a] z-50 transition-opacity duration-500">
                <div class="w-12 h-12 border-4 border-blue-500/20 border-t-blue-500 rounded-full animate-spin"></div>
                <p class="mt-4 text-[9px] font-mono text-slate-500 uppercase tracking-widest">Sincronizando Telemetría...</p>
            </div>

            <!-- Iframe de Windy -->
            <iframe 
                id="windy-frame"
                class="w-full h-full opacity-0 transition-opacity duration-1000"
                src=""
                allowfullscreen
                onload="this.style.opacity='1'; setTimeout(() => document.getElementById('map-loader').style.opacity='0', 500); setTimeout(() => document.getElementById('map-loader').style.display='none', 1000);">
            </iframe>

            <!-- Badge Flotante Info Spot -->
            <div class="absolute top-4 right-4 z-10 pointer-events-none">
                <div class="glass-panel px-3 py-1.5 rounded-full border-blue-500/20 shadow-2xl">
                    <p id="current-spot-label" class="text-[10px] font-bold text-blue-400 uppercase italic tracking-wider">Cargando Spot...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Reporte IA (Full Screen en Mobile) -->
    <div id="ai-modal" class="fixed inset-0 z-[200] flex items-end md:items-center justify-center p-0 md:p-4 bg-black/90 backdrop-blur-md hidden">
        <div class="bg-slate-900 border-t md:border border-slate-700 w-full max-w-2xl rounded-t-3xl md:rounded-3xl overflow-hidden shadow-2xl flex flex-col max-h-[85vh] md:max-h-[80vh]">
            <div class="ai-gradient p-5 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-robot text-xl"></i>
                    <h3 class="text-sm md:text-lg font-bold uppercase tracking-tight">Análisis del Experto</h3>
                </div>
                <button onclick="closeAIModal()" class="bg-black/20 hover:bg-black/40 w-8 h-8 rounded-full flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="ai-content" class="p-6 overflow-y-auto leading-relaxed text-slate-300 text-xs md:text-sm space-y-4"></div>
        </div>
    </div>

    <script>
        // Tu API Key de Google Gemini
        const apiKey = "AIzaSyDjxdya7xT9iJuLnuRmjFAMrKPbNz3dC-U"; 

        const spots = [
            { id: 1, nombre: "Neuquén (Limay)", lat: -38.95, lon: -68.06, zoom: 11 },
            { id: 2, nombre: "Lago Mari Menuco", lat: -38.62418, lon: -68.4606, zoom: 12 },
            { id: 3, nombre: "Bariloche (Nahuel)", lat: -41.13, lon: -71.31, zoom: 11 },
            { id: 4, nombre: "Villa El Chocón", lat: -39.26, lon: -68.79, zoom: 11 },
            { id: 5, nombre: "Las Grutas", lat: -40.81, lon: -65.09, zoom: 11 },
            { id: 6, nombre: "Pucón (Chile)", lat: -39.27, lon: -71.97, zoom: 11 }
        ];

        let currentSpot = spots[1]; 
        const sidebar = document.getElementById('sidebar-ai');
        const windyFrame = document.getElementById('windy-frame');
        const spotsList = document.getElementById('spots-list');
        const currentSpotLabel = document.getElementById('current-spot-label');

        function toggleMobileMenu() {
            if (window.innerWidth < 768) {
                sidebar.classList.toggle('mobile-hidden');
                sidebar.classList.toggle('mobile-visible');
            }
        }

        function getWindyUrl(lat, lon, zoom) {
            // URL configurada para optimizar visibilidad de tabla de pronóstico
            const params = new URLSearchParams({
                lat, lon, detailLat: lat, detailLon: lon,
                width: '100%', height: '100%', zoom, 
                level: 'surface', overlay: 'wind', product: 'ecmwf', 
                message: 'true', marker: 'true', calendar: 'now', 
                location: 'coordinates', detail: 'true', 
                metricWind: 'kt', metricTemp: '°C'
            });
            return `https://embed.windy.com/embed2.html?${params.toString()}`;
        }

        function updateSpot(spotId) {
            currentSpot = spots.find(s => s.id === parseInt(spotId));
            if (!currentSpot) return;

            toggleMobileMenu(); // Cierra el menú al elegir spot

            document.getElementById('map-loader').style.display = 'flex';
            document.getElementById('map-loader').style.opacity = '1';
            
            windyFrame.style.opacity = '0';
            windyFrame.src = getWindyUrl(currentSpot.lat, currentSpot.lon, currentSpot.zoom);
            currentSpotLabel.innerText = currentSpot.nombre;

            // Update button styles
            document.querySelectorAll('.spot-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white', 'border-blue-400');
                btn.classList.add('bg-slate-800/30', 'text-slate-400');
            });
            const activeBtn = document.querySelector(`[data-id="${spotId}"]`);
            if (activeBtn) activeBtn.classList.add('bg-blue-600', 'text-white', 'border-blue-400');
        }

        async function callGemini(prompt, systemInstruction) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: systemInstruction }] }
                    })
                });
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "Mmm, no pude procesar eso. ¿Probamos de nuevo?";
            } catch (err) {
                return "Che, se cortó la onda con el satélite. Fijate si tenés internet.";
            }
        }

        async function generateAIReport() {
            const modal = document.getElementById('ai-modal');
            const content = document.getElementById('ai-content');
            modal.classList.remove('hidden');
            content.innerHTML = `<div class="flex flex-col items-center py-10"><div class="animate-spin h-8 w-8 border-2 border-blue-500 rounded-full border-t-transparent"></div><p class="mt-4 text-[10px] uppercase tracking-widest text-slate-500">Consultando modelos...</p></div>`;

            try {
                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${currentSpot.lat}&longitude=${currentSpot.lon}&current_weather=true&hourly=windspeed_10m,windgusts_10m&windspeed_unit=kn&timezone=auto`);
                const data = await weatherRes.json();
                const wind = data.current_weather.windspeed;

                const result = await callGemini(
                    `Analiza ${currentSpot.nombre}. Viento actual: ${wind} nudos.`,
                    "Eres el Gurú de la Tablapandilla. Responde si es apto para SUP. Usa emojis. Tono neuquino experto."
                );
                content.innerHTML = `<div class="prose prose-invert max-w-none">${result.replace(/\n/g, '<br>')}</div>`;
            } catch (e) {
                content.innerHTML = `<p class="text-red-400">Error al cargar datos.</p>`;
            }
        }

        async function askAI() {
            const input = document.getElementById('chat-input');
            const container = document.getElementById('chat-container');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            container.innerHTML += `<div class="bg-slate-800 p-2.5 rounded-2xl self-end text-slate-200 ml-4 border border-slate-700 shadow-sm">${text}</div>`;
            container.scrollTop = container.scrollHeight;

            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = "bg-blue-600/10 border border-blue-600/20 p-2.5 rounded-2xl text-blue-300 mr-4 animate-pulse italic";
            aiMsgDiv.innerText = "Pensando...";
            container.appendChild(aiMsgDiv);

            try {
                const response = await callGemini(text, `Asistente Tablapandilla. Spot: ${currentSpot.nombre}. Responde breve, amable y con onda.`);
                aiMsgDiv.classList.remove('animate-pulse', 'italic');
                aiMsgDiv.innerText = response;
                container.scrollTop = container.scrollHeight;
            } catch (e) {
                aiMsgDiv.innerText = "Error de conexión.";
            }
        }

        function closeAIModal() { document.getElementById('ai-modal').classList.add('hidden'); }

        function init() {
            spots.forEach(spot => {
                const btn = document.createElement('button');
                btn.className = "spot-btn w-full p-2.5 rounded-xl border transition-all text-[10px] font-bold bg-slate-800/30 text-slate-400 border-transparent hover:bg-slate-800/60 flex items-center gap-2";
                btn.dataset.id = spot.id;
                btn.innerHTML = `<i class="fa-solid fa-location-dot text-[8px]"></i> <span>${spot.nombre}</span>`;
                btn.onclick = () => updateSpot(spot.id);
                spotsList.appendChild(btn);
            });
            
            updateSpot(spots[1].id);
            document.getElementById('chat-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') askAI(); });
        }

        init();
    </script>
</body>
</html>
