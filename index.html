<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tablapandilla | AI Wind Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
        
        #main-content {
            height: calc(100vh - 64px); /* Altura dinámica restando el header */
        }

        .ai-gradient {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
        }

        @keyframes pulse-soft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .animate-pulse-soft {
            animation: pulse-soft 2s infinite;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Transición para el chat móvil */
        #sidebar-ai {
            transition: transform 0.3s ease-in-out;
        }

        @media (max-width: 768px) {
            .mobile-hidden { transform: translateX(-100%); }
            .mobile-visible { transform: translateX(0); }
        }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-200 h-screen flex flex-col overflow-hidden">

    <!-- Header Principal -->
    <header class="bg-[#1e293b] border-b border-slate-700 h-16 flex justify-between items-center px-4 shadow-lg z-50">
        <div class="flex items-center gap-2 md:gap-3">
            <button onclick="toggleMobileMenu()" class="md:hidden text-white p-2">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="bg-blue-600 p-1.5 rounded-lg shadow-inner">
                <i class="fa-solid fa-wind text-white text-base md:text-xl"></i>
            </div>
            <div>
                <h1 class="text-sm md:text-xl font-bold tracking-tight text-white uppercase italic leading-none">Tablapandilla <span class="text-blue-400 text-[10px] md:text-sm font-normal not-italic">v3.4</span></h1>
                <p class="text-[8px] md:text-[10px] text-slate-400 font-mono tracking-widest uppercase">AI Dashboard</p>
            </div>
        </div>
        
        <div class="flex items-center gap-2">
            <button onclick="generateAIReport()" class="ai-gradient hover:opacity-90 text-white px-3 py-1.5 md:px-4 md:py-2 rounded-lg text-[10px] md:text-sm font-bold flex items-center gap-2 transition-all shadow-lg active:scale-95">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span class="hidden xs:inline">✨ Informe IA</span>
            </button>
            <button onclick="toggleMobileMenu()" class="md:hidden bg-slate-800 text-blue-400 p-2 rounded-lg border border-slate-700">
                <i class="fa-solid fa-comment-dots text-lg"></i>
            </button>
        </div>
    </header>

    <div id="main-content" class="flex flex-1 relative overflow-hidden">
        
        <!-- Sidebar: Chat & Spots -->
        <aside id="sidebar-ai" class="absolute md:relative z-40 w-full md:w-80 bg-[#0b0f1a] border-r border-slate-800 h-full flex flex-col mobile-hidden md:transform-none">
            
            <!-- Header Móvil del Sidebar -->
            <div class="md:hidden p-4 border-b border-slate-800 flex justify-between items-center bg-[#1e293b]">
                <span class="font-bold text-blue-400">PANEL DE CONTROL</span>
                <button onclick="toggleMobileMenu()" class="text-slate-400 text-xl">&times;</button>
            </div>

            <!-- Listado de Spots (Compacto) -->
            <div class="p-4 border-b border-slate-800/50">
                <h2 class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em] mb-3">Ubicaciones</h2>
                <div id="spots-list" class="grid grid-cols-2 md:grid-cols-1 gap-2"></div>
            </div>
            
            <!-- Chat IA -->
            <div class="p-4 flex flex-col flex-1 overflow-hidden">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em]">Chat Gemini</h2>
                    <span class="text-[9px] text-green-400 bg-green-400/10 px-2 py-0.5 rounded border border-green-400/20">ONLINE</span>
                </div>
                <div id="chat-container" class="bg-slate-900/50 rounded-xl border border-slate-800 p-3 flex-1 overflow-y-auto text-[11px] space-y-3 flex flex-col">
                    <div class="bg-blue-500/10 border border-blue-500/20 p-2 rounded-lg text-blue-300">
                        ¡Hola Wopita! Preguntame lo que quieras sobre el viento.
                    </div>
                </div>
                <div class="mt-3 flex gap-1">
                    <input type="text" id="chat-input" placeholder="¿Está para remar?" class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-blue-500 text-white">
                    <button onclick="askAI()" class="bg-blue-600 p-2 rounded-lg hover:bg-blue-500 transition-colors shadow-lg">
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Contenedor del Mapa (Ocupa todo el resto) -->
        <main class="flex-1 relative bg-[#0f172a] h-full">
            
            <!-- Badge de Spot Actual -->
            <div class="absolute top-4 right-4 z-30 pointer-events-none">
                <div class="glass-panel px-3 py-1.5 md:px-4 md:py-2 rounded-xl border-blue-500/30">
                    <p id="current-spot-label" class="text-[10px] md:text-xs font-bold text-white uppercase tracking-wider italic">Mari Menuco</p>
                </div>
            </div>

            <!-- Loader -->
            <div id="map-loader" class="absolute inset-0 flex flex-col items-center justify-center bg-[#0f172a] z-10 text-center px-4">
                <div class="relative w-12 h-12 md:w-16 md:h-16">
                    <div class="absolute inset-0 border-4 border-blue-500/20 rounded-full"></div>
                    <div class="absolute inset-0 border-4 border-t-blue-500 rounded-full animate-spin"></div>
                </div>
                <p class="mt-4 text-[10px] font-mono text-slate-500 animate-pulse uppercase tracking-[0.2em]">Sincronizando Windy...</p>
            </div>

            <!-- Iframe de Windy (Ajustado para no cortarse) -->
            <iframe 
                id="windy-frame"
                class="w-full h-full relative z-0 opacity-0 transition-opacity duration-700 border-none"
                src=""
                allowfullscreen
                onload="this.style.opacity='1'; document.getElementById('map-loader').style.display='none';">
            </iframe>

            <!-- Modal Reporte IA (Responsivo) -->
            <div id="ai-modal" class="fixed inset-0 z-[60] flex items-center justify-center p-2 md:p-4 bg-black/90 backdrop-blur-md hidden">
                <div class="bg-slate-900 border border-slate-700 w-full max-w-2xl rounded-2xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
                    <div class="ai-gradient p-4 md:p-6 flex justify-between items-center shadow-lg">
                        <h3 class="text-base md:text-xl font-bold flex items-center gap-2">
                            <i class="fa-solid fa-microchip"></i> Inteligencia de Spot
                        </h3>
                        <button onclick="closeAIModal()" class="text-white/70 hover:text-white text-3xl leading-none">&times;</button>
                    </div>
                    <div id="ai-content" class="p-4 md:p-8 overflow-y-auto leading-relaxed text-slate-300 text-sm md:text-base"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const apiKey = "AIzaSyDjxdya7xT9iJuLnuRmjFAMrKPbNz3dC-U"; 

        const spots = [
            { id: 1, nombre: "Nqn (Limay)", lat: -38.95, lon: -68.06, zoom: 11 },
            { id: 2, nombre: "Mari Menuco", lat: -38.6241, lon: -68.4606, zoom: 12 },
            { id: 3, nombre: "N. Huapi", lat: -41.13, lon: -71.31, zoom: 11 },
            { id: 4, nombre: "El Chocón", lat: -39.26, lon: -68.79, zoom: 11 },
            { id: 5, nombre: "Las Grutas", lat: -40.81, lon: -65.09, zoom: 11 },
            { id: 6, nombre: "Pucón", lat: -39.27, lon: -71.97, zoom: 11 }
        ];

        let currentSpot = spots[1]; 
        const windyFrame = document.getElementById('windy-frame');
        const spotsList = document.getElementById('spots-list');
        const currentSpotLabel = document.getElementById('current-spot-label');
        const sidebar = document.getElementById('sidebar-ai');

        function toggleMobileMenu() {
            sidebar.classList.toggle('mobile-hidden');
            sidebar.classList.toggle('mobile-visible');
        }

        function getWindyUrl(lat, lon, zoom) {
            const params = new URLSearchParams({
                lat, lon, detailLat: lat, detailLon: lon, width: '100%', height: '100%',
                zoom, level: 'surface', overlay: 'wind', product: 'ecmwf', 
                message: 'true', marker: 'true', calendar: 'now', type: 'map', 
                location: 'coordinates', detail: 'true', metricWind: 'kt', metricTemp: '°C'
            });
            return `https://embed.windy.com/embed2.html?${params.toString()}`;
        }

        function updateSpot(spotId) {
            currentSpot = spots.find(s => s.id === parseInt(spotId));
            if (!currentSpot) return;

            if (window.innerWidth < 768) toggleMobileMenu();

            windyFrame.style.opacity = '0';
            document.getElementById('map-loader').style.display = 'flex';
            windyFrame.src = getWindyUrl(currentSpot.lat, currentSpot.lon, currentSpot.zoom);
            currentSpotLabel.innerText = currentSpot.nombre;

            document.querySelectorAll('.spot-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white', 'border-blue-400');
                btn.classList.add('bg-slate-800/30', 'text-slate-400');
            });
            const activeBtn = document.querySelector(`[data-id="${spotId}"]`);
            if (activeBtn) activeBtn.classList.add('bg-blue-600', 'text-white', 'border-blue-400');
        }

        async function fetchDetailedWeather(lat, lon) {
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=windspeed_10m,winddirection_10m,windgusts_10m&windspeed_unit=kn&timezone=auto`);
            return await res.json();
        }

        async function callGemini(prompt, systemInstruction) {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    systemInstruction: { parts: [{ text: systemInstruction }] }
                })
            });
            const data = await response.json();
            return data.candidates?.[0]?.content?.parts?.[0]?.text || "Error en la IA.";
        }

        async function generateAIReport() {
            const modal = document.getElementById('ai-modal');
            const content = document.getElementById('ai-content');
            modal.classList.remove('hidden');
            content.innerHTML = `<div class="flex flex-col items-center py-10"><div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-500"></div><p class="mt-4 text-xs font-mono text-slate-500 animate-pulse">Analizando spot...</p></div>`;

            try {
                const data = await fetchDetailedWeather(currentSpot.lat, currentSpot.lon);
                const result = await callGemini(
                    `Analiza ${currentSpot.nombre}. Viento ${data.current_weather.windspeed}kt. ¿Es apto para SUP?`,
                    "Eres el Gurú de la Tablapandilla. Tono experto, breve y de Neuquén."
                );
                content.innerHTML = `<div class="space-y-4">${result.replace(/\n/g, '<br>')}</div>`;
            } catch (error) {
                content.innerHTML = `<p class="text-red-400 text-center">Falla en la conexión.</p>`;
            }
        }

        async function askAI() {
            const input = document.getElementById('chat-input');
            const container = document.getElementById('chat-container');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            container.innerHTML += `<div class="bg-slate-800 p-2 rounded-lg self-end text-slate-200 ml-4 border border-slate-700">${text}</div>`;
            container.scrollTop = container.scrollHeight;

            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = "bg-blue-500/10 border border-blue-500/20 p-2 rounded-lg text-blue-300 mr-4 animate-pulse italic";
            aiMsgDiv.innerText = "Sincronizando modelos...";
            container.appendChild(aiMsgDiv);
            container.scrollTop = container.scrollHeight;

            try {
                const data = await fetchDetailedWeather(currentSpot.lat, currentSpot.lon);
                const response = await callGemini(text, `Asistente Tablapandilla. SPOT: ${currentSpot.nombre}. VIENTO: ${data.current_weather.windspeed}kt. Responde breve y amigable.`);
                aiMsgDiv.classList.remove('animate-pulse', 'italic');
                aiMsgDiv.innerText = response;
                container.scrollTop = container.scrollHeight;
            } catch (e) {
                aiMsgDiv.innerText = "Error.";
            }
        }

        function closeAIModal() { document.getElementById('ai-modal').classList.add('hidden'); }

        function init() {
            spots.forEach(spot => {
                const btn = document.createElement('button');
                btn.className = "spot-btn flex-1 md:w-full flex items-center justify-center md:justify-start p-2 md:p-3 rounded-lg border transition-all duration-300 text-[10px] font-semibold bg-slate-800/30 text-slate-400 border-transparent hover:bg-slate-800/60";
                btn.dataset.id = spot.id;
                btn.innerText = spot.nombre;
                btn.onclick = () => updateSpot(spot.id);
                spotsList.appendChild(btn);
            });
            
            updateSpot(spots[1].id);
            document.getElementById('chat-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') askAI(); });
        }

        init();
    </script>
</body>
</html>
