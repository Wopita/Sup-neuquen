<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tablapandilla | AI Wind Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Variables de altura para evitar saltos en móviles */
        :root {
            --header-h: 60px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            height: 100vh;
            height: 100dvh; /* Altura dinámica para móviles */
            background-color: #0f172a;
            color: #f1f5f9;
            font-family: ui-sans-serif, system-ui, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            height: var(--header-h);
            flex-shrink: 0;
        }

        #main-container {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        /* Sidebar con estilo overlay en móvil */
        #sidebar-ai {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 100%;
            z-index: 50;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(11, 15, 26, 0.98);
        }

        @media (min-width: 768px) {
            #sidebar-ai {
                position: relative;
                width: 320px;
                transform: none !important;
                background: #0b0f1a;
            }
        }

        .mobile-hidden {
            transform: translateX(-100%);
        }

        /* Iframe ocupa todo el espacio */
        .map-wrapper {
            flex: 1;
            position: relative;
            height: 100%;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .ai-gradient {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
        }

        .glass-badge {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        
        /* Animación suave para el chat */
        .chat-bubble {
            max-width: 85%;
            border-radius: 1.25rem;
            padding: 0.75rem 1rem;
            font-size: 0.8rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="bg-[#1e293b] border-b border-slate-700 flex justify-between items-center px-4 shadow-2xl z-[60]">
        <div class="flex items-center gap-3">
            <button onclick="toggleSidebar()" class="md:hidden text-blue-400 p-2 rounded-lg hover:bg-slate-800">
                <i class="fa-solid fa-bars-staggered"></i>
            </button>
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 p-1.5 rounded-lg shadow-lg">
                    <i class="fa-solid fa-wind text-white text-sm"></i>
                </div>
                <div>
                    <h1 class="text-xs md:text-base font-bold text-white uppercase italic tracking-tighter leading-none">Tablapandilla <span class="text-blue-400 font-normal">v3.6</span></h1>
                    <p class="text-[8px] text-slate-500 font-mono tracking-widest mt-0.5">AI WIND SYSTEM</p>
                </div>
            </div>
        </div>
        
        <div class="flex items-center gap-2">
            <button onclick="generateAIReport()" class="ai-gradient text-white px-3 py-1.5 rounded-full text-[9px] md:text-xs font-black shadow-lg shadow-blue-500/20 active:scale-95 transition-all">
                <i class="fa-solid fa-wand-magic-sparkles"></i> <span class="hidden xs:inline">ANALIZAR SPOT</span>
            </button>
            <button onclick="toggleSidebar()" class="md:hidden bg-blue-500/10 text-blue-400 p-2 rounded-full border border-blue-500/20">
                <i class="fa-solid fa-comment-dots"></i>
            </button>
        </div>
    </header>

    <div id="main-container">
        
        <!-- Sidebar -->
        <aside id="sidebar-ai" class="flex flex-col mobile-hidden border-r border-slate-800">
            <!-- Spots -->
            <div class="p-4 border-b border-slate-800/50">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Spots SUP</h2>
                    <button onclick="toggleSidebar()" class="md:hidden text-slate-500 p-1">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div id="spots-list" class="grid grid-cols-2 md:grid-cols-1 gap-2"></div>
            </div>
            
            <!-- Chat -->
            <div class="p-4 flex flex-col flex-1 overflow-hidden">
                <div class="flex items-center gap-2 mb-3">
                    <span class="h-2 w-2 rounded-full bg-blue-500 animate-pulse"></span>
                    <h2 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Asistente Gemini</h2>
                </div>
                <div id="chat-container" class="bg-slate-900/30 rounded-2xl border border-slate-800/50 p-3 flex-1 overflow-y-auto space-y-3 flex flex-col">
                    <div class="chat-bubble bg-blue-600/10 border border-blue-500/20 text-blue-200 self-start">
                        ¡Hola Wopita! 👋 Ya sincronicé con Windy. ¿Alguna duda sobre el viento en el Mari?
                    </div>
                </div>
                <div class="mt-4 relative">
                    <input type="text" id="chat-input" placeholder="Preguntá algo..." class="w-full bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:ring-1 focus:ring-blue-500">
                    <button onclick="askAI()" class="absolute right-2 top-1/2 -translate-y-1/2 bg-blue-600 text-white p-2 rounded-lg hover:bg-blue-500 transition-all">
                        <i class="fa-solid fa-paper-plane text-[10px]"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Mapa -->
        <main class="map-wrapper">
            <div id="map-loader" class="absolute inset-0 flex flex-col items-center justify-center bg-[#0f172a] z-40 transition-opacity duration-500">
                <div class="w-10 h-10 border-2 border-blue-500/20 border-t-blue-500 rounded-full animate-spin"></div>
                <p class="mt-4 text-[9px] font-mono text-slate-500 uppercase tracking-widest">Sincronizando Satélites...</p>
            </div>

            <iframe id="windy-frame" src="" allowfullscreen onload="hideLoader()"></iframe>

            <div class="absolute top-4 right-4 z-10">
                <div class="glass-badge px-3 py-1.5 rounded-full shadow-2xl">
                    <p id="current-spot-label" class="text-[9px] font-bold text-blue-400 uppercase tracking-wider italic">Cargando...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Reporte -->
    <div id="ai-modal" class="fixed inset-0 z-[100] flex items-end md:items-center justify-center p-0 md:p-4 bg-black/90 backdrop-blur-sm hidden">
        <div class="bg-slate-900 border-t md:border border-slate-700 w-full max-w-2xl rounded-t-3xl md:rounded-2xl overflow-hidden shadow-2xl flex flex-col max-h-[85vh]">
            <div class="ai-gradient p-4 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-robot"></i>
                    <h3 class="text-xs md:text-sm font-bold uppercase tracking-widest">Análisis del Gurú</h3>
                </div>
                <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-black/20 text-white">&times;</button>
            </div>
            <div id="ai-content" class="p-6 overflow-y-auto text-slate-300 text-xs md:text-sm leading-relaxed space-y-3"></div>
        </div>
    </div>

    <script>
        const apiKey = "AIzaSyDjxdya7xT9iJuLnuRmjFAMrKPbNz3dC-U"; 
        const spots = [
            { id: 1, nombre: "Limay", lat: -38.95, lon: -68.06, zoom: 11 },
            { id: 2, nombre: "Mari Menuco", lat: -38.6241, lon: -68.4606, zoom: 12 },
            { id: 3, nombre: "N. Huapi", lat: -41.13, lon: -71.31, zoom: 11 },
            { id: 4, nombre: "El Chocón", lat: -39.26, lon: -68.79, zoom: 11 },
            { id: 5, nombre: "Las Grutas", lat: -40.81, lon: -65.09, zoom: 11 },
            { id: 6, nombre: "Pucón", lat: -39.27, lon: -71.97, zoom: 11 }
        ];

        let currentSpot = spots[1];
        const sidebar = document.getElementById('sidebar-ai');
        const frame = document.getElementById('windy-frame');
        const label = document.getElementById('current-spot-label');

        function toggleSidebar() {
            if (window.innerWidth < 768) {
                sidebar.classList.toggle('mobile-hidden');
            }
        }

        function hideLoader() {
            const loader = document.getElementById('map-loader');
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 500);
            frame.style.opacity = '1';
        }

        function updateSpot(id) {
            currentSpot = spots.find(s => s.id === id);
            label.innerText = currentSpot.nombre;
            
            document.getElementById('map-loader').style.display = 'flex';
            document.getElementById('map-loader').style.opacity = '1';
            
            const params = new URLSearchParams({
                lat: currentSpot.lat, lon: currentSpot.lon, detailLat: currentSpot.lat, detailLon: currentSpot.lon,
                width: '100%', height: '100%', zoom: currentSpot.zoom, level: 'surface', overlay: 'wind',
                product: 'ecmwf', message: 'true', marker: 'true', calendar: 'now', detail: 'true', 
                metricWind: 'kt', metricTemp: '°C'
            });
            frame.src = `https://embed.windy.com/embed2.html?${params.toString()}`;
            
            document.querySelectorAll('.spot-btn').forEach(b => b.classList.replace('bg-blue-600', 'bg-slate-800/30'));
            const active = document.querySelector(`[data-id="${id}"]`);
            if (active) active.classList.replace('bg-slate-800/30', 'bg-blue-600');
            
            if (window.innerWidth < 768) toggleSidebar();
        }

        async function callGemini(prompt, sys) {
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: sys }] }
                    })
                });
                const data = await res.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "Lo siento, la IA está de franco.";
            } catch (e) {
                return "Error de conexión. Chequeá tu internet, Wopita.";
            }
        }

        async function generateAIReport() {
            const modal = document.getElementById('ai-modal');
            const content = document.getElementById('ai-content');
            modal.classList.remove('hidden');
            content.innerHTML = `<div class="flex flex-col items-center py-6"><div class="animate-spin h-6 w-6 border-2 border-blue-500 rounded-full border-t-transparent"></div></div>`;

            try {
                const weather = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${currentSpot.lat}&longitude=${currentSpot.lon}&current_weather=true&windspeed_unit=kn`)).json();
                const wind = weather.current_weather.windspeed;
                const result = await callGemini(`Analiza ${currentSpot.nombre} con ${wind} nudos. ¿SUP apto?`, "Eres el Gurú de la Tablapandilla. Tono experto, breve y con mucha onda. Usa emojis.");
                content.innerHTML = `<div>${result.replace(/\n/g, '<br>')}</div>`;
            } catch (e) {
                content.innerHTML = "Error cargando datos.";
            }
        }

        async function askAI() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            
            const chat = document.getElementById('chat-container');
            chat.innerHTML += `<div class="chat-bubble bg-slate-800 self-end border border-slate-700 text-slate-200">${text}</div>`;
            chat.scrollTop = chat.scrollHeight;

            const resDiv = document.createElement('div');
            resDiv.className = "chat-bubble bg-blue-600/10 border border-blue-500/20 text-blue-300 animate-pulse";
            resDiv.innerText = "Pensando...";
            chat.appendChild(resDiv);

            const response = await callGemini(text, `Asistente Tablapandilla. Spot: ${currentSpot.nombre}. Responde breve y amigable.`);
            resDiv.classList.remove('animate-pulse');
            resDiv.innerText = response;
            chat.scrollTop = chat.scrollHeight;
        }

        function closeModal() { document.getElementById('ai-modal').classList.add('hidden'); }

        function init() {
            const list = document.getElementById('spots-list');
            spots.forEach(s => {
                const b = document.createElement('button');
                b.className = "spot-btn p-3 rounded-xl border border-transparent bg-slate-800/30 text-[10px] font-bold text-slate-400 hover:bg-slate-800 transition-all flex items-center gap-2";
                b.dataset.id = s.id;
                b.innerHTML = `<i class="fa-solid fa-location-dot text-[8px]"></i> <span>${s.nombre}</span>`;
                b.onclick = () => updateSpot(s.id);
                list.appendChild(b);
            });
            updateSpot(2);
            document.getElementById('chat-input').addEventListener('keypress', (e) => e.key === 'Enter' && askAI());
        }

        init();
    </script>
</body>
</html>
