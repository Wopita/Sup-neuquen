<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablapandilla | AI Wind Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        
        #map-container {
            height: calc(100vh - 73px);
        }

        .ai-gradient {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
        }

        @keyframes pulse-soft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .animate-pulse-soft {
            animation: pulse-soft 2s infinite;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-200 h-screen flex flex-col overflow-hidden">

    <!-- Header Principal -->
    <header class="bg-[#1e293b] border-b border-slate-700 p-4 flex justify-between items-center shadow-lg z-20">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 p-2 rounded-lg shadow-inner">
                <i class="fa-solid fa-wind text-white text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight text-white uppercase italic">Tablapandilla <span class="text-blue-400 text-sm font-normal not-italic">v3.3 ✨</span></h1>
                <p class="text-[10px] text-slate-400 font-mono tracking-widest uppercase italic">AI Deep Analysis</p>
            </div>
        </div>
        
        <div class="flex items-center gap-2 md:gap-4">
            <button onclick="generateAIReport()" class="ai-gradient hover:opacity-90 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 transition-all shadow-lg shadow-purple-500/20 active:scale-95">
                <i class="fa-solid fa-wand-magic-sparkles text-xs"></i>
                <span class="hidden sm:inline">✨ Informe Experto</span>
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-72 bg-[#0b0f1a] border-r border-slate-800 flex flex-col hidden md:flex">
            <div class="p-6 border-b border-slate-800/50">
                <h2 class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em] mb-4">Ubicaciones</h2>
                <div id="spots-list" class="space-y-3"></div>
            </div>
            
            <div class="p-6 flex flex-col flex-1">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em]">Chat Inteligente</h2>
                    <span id="ai-status" class="text-[9px] text-blue-400 bg-blue-400/10 px-2 py-0.5 rounded border border-blue-400/20 uppercase">Online</span>
                </div>
                <div id="chat-container" class="bg-slate-900/50 rounded-xl border border-slate-800 p-4 flex-1 overflow-y-auto text-[11px] space-y-3 flex flex-col min-h-[200px]">
                    <div class="bg-blue-500/10 border border-blue-500/20 p-2 rounded-lg text-blue-300">
                        ¡Todo listo, Wopita! La API Key está activa. ¿Qué querés saber sobre el viento hoy?
                    </div>
                </div>
                <div class="mt-4 flex gap-1">
                    <input type="text" id="chat-input" placeholder="¿Cómo viene el viento?" class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-blue-500 text-white">
                    <button id="chat-send-btn" onclick="askAI()" class="bg-blue-600 p-2 rounded-lg hover:bg-blue-500 transition-colors shadow-lg shadow-blue-900/40">
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Contenedor del Mapa -->
        <main id="map-container" class="flex-1 relative bg-[#0f172a]">
            <!-- Info Badge (Desktop) -->
            <div class="hidden md:block absolute top-4 right-4 z-30">
                <div class="glass-panel px-4 py-2 rounded-xl border-blue-500/30">
                    <p id="current-spot-label" class="text-xs font-bold text-white uppercase tracking-wider italic">Mari Menuco</p>
                </div>
            </div>

            <!-- Selector para móviles -->
            <div class="md:hidden absolute top-4 left-4 z-30 w-[calc(100%-2rem)]">
                <select id="mobile-spot-selector" class="w-full bg-[#1e293b] text-white border border-slate-700 rounded-xl p-4 shadow-2xl outline-none appearance-none"></select>
            </div>

            <div id="map-loader" class="absolute inset-0 flex flex-col items-center justify-center bg-[#0f172a] z-10 text-center px-4">
                <div class="relative w-16 h-16">
                    <div class="absolute inset-0 border-4 border-blue-500/20 rounded-full"></div>
                    <div class="absolute inset-0 border-4 border-t-blue-500 rounded-full animate-spin"></div>
                </div>
                <p class="mt-4 text-xs font-mono text-slate-500 animate-pulse uppercase tracking-[0.3em]">Cargando telemetría de viento...</p>
            </div>

            <iframe 
                id="windy-frame"
                class="w-full h-full relative z-0 opacity-0 transition-opacity duration-700"
                src=""
                allowfullscreen
                onload="this.style.opacity='1'; document.getElementById('map-loader').style.display='none';">
            </iframe>

            <!-- Modal de Reporte IA -->
            <div id="ai-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm hidden">
                <div class="bg-slate-900 border border-slate-700 w-full max-w-2xl rounded-2xl overflow-hidden shadow-2xl">
                    <div class="ai-gradient p-6 flex justify-between items-center shadow-lg">
                        <h3 class="text-xl font-bold flex items-center gap-2">
                            <i class="fa-solid fa-microchip"></i> Análisis de Spot con IA
                        </h3>
                        <button onclick="closeAIModal()" class="text-white/70 hover:text-white text-2xl leading-none">&times;</button>
                    </div>
                    <div id="ai-content" class="p-8 max-h-[70vh] overflow-y-auto leading-relaxed text-slate-300"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- API KEY INTEGRADA CORRECTAMENTE ---
        const apiKey = "AIzaSyDjxdya7xT9iJuLnuRmjFAMrKPbNz3dC-U"; 

        const spots = [
            { id: 1, nombre: "Neuquén (Limay)", lat: -38.95, lon: -68.06, zoom: 11 },
            { id: 2, nombre: "Lago Mari Menuco", lat: -38.62418741729627, lon: -68.46069412017282, zoom: 12 },
            { id: 3, nombre: "Nahuel Huapi", lat: -41.13, lon: -71.31, zoom: 11 },
            { id: 4, nombre: "Villa El Chocón", lat: -39.26, lon: -68.79, zoom: 11 },
            { id: 5, nombre: "Las Grutas", lat: -40.81, lon: -65.09, zoom: 11 },
            { id: 6, nombre: "Pucón (Villarrica)", lat: -39.27, lon: -71.97, zoom: 11 }
        ];

        let currentSpot = spots[1]; 
        const windyFrame = document.getElementById('windy-frame');
        const spotsList = document.getElementById('spots-list');
        const mobileSelector = document.getElementById('mobile-spot-selector');
        const currentSpotLabel = document.getElementById('current-spot-label');

        function getWindyUrl(lat, lon, zoom) {
            const params = new URLSearchParams({
                lat, lon, detailLat: lat, detailLon: lon, width: '100%', height: '100%',
                zoom, level: 'surface', overlay: 'wind', product: 'ecmwf', 
                message: 'true', marker: 'true', calendar: 'now', type: 'map', 
                location: 'coordinates', detail: 'true', metricWind: 'kt', metricTemp: '°C'
            });
            return `https://embed.windy.com/embed2.html?${params.toString()}`;
        }

        function updateSpot(spotId) {
            currentSpot = spots.find(s => s.id === parseInt(spotId));
            if (!currentSpot) return;

            windyFrame.style.opacity = '0';
            document.getElementById('map-loader').style.display = 'flex';
            windyFrame.src = getWindyUrl(currentSpot.lat, currentSpot.lon, currentSpot.zoom);
            currentSpotLabel.innerText = currentSpot.nombre;

            document.querySelectorAll('.spot-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white', 'border-blue-400', 'shadow-lg', 'shadow-blue-900/20');
                btn.classList.add('bg-slate-800/30', 'text-slate-400', 'border-transparent');
            });
            const activeBtn = document.querySelector(`[data-id="${spotId}"]`);
            if (activeBtn) {
                activeBtn.classList.add('bg-blue-600', 'text-white', 'border-blue-400', 'shadow-lg', 'shadow-blue-900/20');
                activeBtn.classList.remove('bg-slate-800/30', 'text-slate-400', 'border-transparent');
            }
        }

        async function fetchDetailedWeather(lat, lon) {
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=windspeed_10m,winddirection_10m,windgusts_10m,temperature_2m&windspeed_unit=kn&timezone=auto&forecast_days=1`);
            return await res.json();
        }

        async function callGemini(prompt, systemInstruction) {
            if (!apiKey) {
                return "❌ Error: API Key no configurada.";
            }

            let delay = 1000;
            for (let i = 0; i < 5; i++) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            systemInstruction: { parts: [{ text: systemInstruction }] }
                        })
                    });
                    const data = await response.json();
                    if (data.error) throw new Error(data.error.message);
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || "No se pudo obtener respuesta del modelo.";
                } catch (error) {
                    if (i === 4) return `❌ Error de API: ${error.message}`;
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= 2;
                }
            }
        }

        async function generateAIReport() {
            const modal = document.getElementById('ai-modal');
            const content = document.getElementById('ai-content');
            modal.classList.remove('hidden');
            content.innerHTML = `<div class="flex flex-col items-center py-10"><div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-500 mb-4"></div><p class="text-slate-400 font-mono animate-pulse-soft italic">Analizando modelos ECMWF...</p></div>`;

            try {
                const data = await fetchDetailedWeather(currentSpot.lat, currentSpot.lon);
                const hourly = data.hourly;
                let forecastText = "PRONÓSTICO PRÓXIMAS HORAS:\n";
                for(let i=0; i<6; i++) {
                    forecastText += `+${i}h: ${hourly.windspeed_10m[i]}kt (Raf: ${hourly.windgusts_10m[i]}kt) Dir: ${hourly.winddirection_10m[i]}°\n`;
                }

                const result = await callGemini(
                    `LUGAR: ${currentSpot.nombre}. ACTUAL: ${data.current_weather.windspeed}kt. ${forecastText}`,
                    "Eres el Gurú de la Tablapandilla. Analiza si es seguro para SUP. Tono neuquino y experto."
                );
                content.innerHTML = `<div class="prose prose-invert max-w-none text-sm leading-relaxed">${result.replace(/\n/g, '<br>')}</div>`;
            } catch (error) {
                content.innerHTML = `<p class="text-red-400">Error al obtener datos meteorológicos.</p>`;
            }
        }

        async function askAI() {
            const input = document.getElementById('chat-input');
            const container = document.getElementById('chat-container');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            container.innerHTML += `<div class="bg-slate-800 p-2 rounded-lg self-end text-slate-200 ml-4 border border-slate-700 shadow-sm">${text}</div>`;
            container.scrollTop = container.scrollHeight;

            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = "bg-blue-500/10 border border-blue-500/20 p-2 rounded-lg text-blue-300 mr-4 animate-pulse italic";
            aiMsgDiv.innerText = "Consultando el mapa...";
            container.appendChild(aiMsgDiv);
            container.scrollTop = container.scrollHeight;

            try {
                const data = await fetchDetailedWeather(currentSpot.lat, currentSpot.lon);
                const current = data.current_weather;
                const response = await callGemini(text, `Asistente Tablapandilla. SPOT: ${currentSpot.nombre}. VIENTO: ${current.windspeed}kt. Responde breve y amigable. Somos de Neuquén.`);
                
                aiMsgDiv.classList.remove('animate-pulse', 'italic');
                aiMsgDiv.innerText = response;
                container.scrollTop = container.scrollHeight;
            } catch (e) {
                aiMsgDiv.innerText = "Error de conexión con la IA.";
                aiMsgDiv.classList.add('text-red-400');
            }
        }

        function closeAIModal() { document.getElementById('ai-modal').classList.add('hidden'); }

        function init() {
            spots.forEach(spot => {
                const btn = document.createElement('button');
                btn.className = "spot-btn w-full flex items-center justify-between p-4 rounded-xl border transition-all duration-300 text-[11px] font-semibold bg-slate-800/30 text-slate-400 border-transparent hover:bg-slate-800/60 group";
                btn.dataset.id = spot.id;
                btn.innerHTML = `
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-location-dot text-[10px] group-hover:text-blue-400 transition-colors"></i>
                        <span>${spot.nombre}</span>
                    </div>
                `;
                btn.onclick = () => updateSpot(spot.id);
                spotsList.appendChild(btn);

                const option = document.createElement('option');
                option.value = spot.id; option.innerText = spot.nombre;
                mobileSelector.appendChild(option);
            });
            mobileSelector.onchange = (e) => updateSpot(e.target.value);
            updateSpot(spots[1].id);
            
            document.getElementById('chat-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') askAI();
            });
        }

        init();
    </script>
</body>
</html>
